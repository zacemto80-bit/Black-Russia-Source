name: APK Builder
on:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Fix dead repositories and dependencies
        run: |
          rm -f local.properties

          # прибираємо мертвий jcenter
          grep -rl "jcenter()" --include=*.gradle . | xargs -r sed -i '/jcenter()/d'

          # заміна бібліотек на робочі координати
          sed -i "s#ru.egslava:MaskedEditText:1.0.5#com.github.egslava:edittext-mask:1.0.5#" app/build.gradle
          sed -i "s#com.dinuscxj:circleprogressbar:1.3.6#com.github.dinuscxj:CircleProgressBar:1.3.6#" app/build.gradle
          sed -i "s#com.mindorks.android:prdownloader:0.6.0#com.github.MindorksOpenSource:PRDownloader:0.6.0#" app/build.gradle
          sed -i "s#com.hzy:un7zip:+#com.github.hzy3774:AndroidUn7zip:0.5#" app/build.gradle

          # init-скрипт: додає mavenCentral і jitpack у всі проєкти
          cat > $HOME/repos.gradle <<'EOF'
          allprojects {
            repositories {
              mavenCentral()
              maven { url 'https://jitpack.io' }
            }
          }
          EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --init-script $HOME/repos.gradle --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BlackRussia-debug-apk
          path: app/build/outputs/apk/**/*.apk
